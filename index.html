<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice System — Yak Yim Thai Kitchen</title>
<style>
  :root{
    --navy: #1c4e73;
    --navy-dark: #143a56;
    --navy-darker: #0e2c42;
    --cream: #faf7f0;
    --paper: #ffffff;
    --ink: #23303d;
    --ink-soft: #5c6b7a;
    --line: #dde3e9;
    --gold: #c8963f;
    --red: #b3271f;
    --row-a: #fffdf3;
    --row-b: #eaf2f8;
    --good: #2f7d4f;
    --good-bg: #e7f5ec;
    --bad: #b3271f;
    --bad-bg: #fbeceb;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,40,60,.06), 0 6px 20px rgba(20,40,60,.06);
    font-family: "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);}
  body{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== App Shell ===== */
  #app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg,var(--navy),var(--navy-darker));
    color:#fff;border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
    border:1px solid rgba(255,255,255,.25);
  }
  .brand-text h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand-text p{margin:2px 0 0;font-size:12px;color:#cfe0ee;}
  .topbar-actions{display:flex;gap:8px;}
  .crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin:0 2px 16px;flex-wrap:wrap;}
  .crumbs button{background:none;border:none;color:var(--navy);font-weight:600;padding:2px 4px;border-radius:6px;font-size:13px;}
  .crumbs button:hover{background:#e7eef4;}
  .crumbs .sep{color:#b6c1cb;}
  .crumbs .current{color:var(--ink);font-weight:600;}

  /* ===== Buttons ===== */
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--navy);color:var(--navy);}
  .btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);color:#fff;}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn-gold:hover{background:#b3822f;color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--navy);padding:8px 10px;}
  .btn-ghost:hover{background:#e7eef4;}
  .btn-danger{color:var(--red);border-color:#f0c9c7;}
  .btn-danger:hover{background:var(--bad-bg);border-color:var(--red);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px;}
  .topbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff;}
  .topbar .btn:hover{background:rgba(255,255,255,.2);color:#fff;}
  .topbar .btn-gold{background:var(--gold);border-color:var(--gold);}

  /* ===== Cards / layout ===== */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:20px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:17px;margin:0;}
  .section-head .hint{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .grid-shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .shop-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;
  }
  .shop-card:hover{border-color:var(--navy);transform:translateY(-1px);}
  .shop-card .tag{
    position:absolute;top:14px;right:14px;font-size:11px;background:var(--good-bg);color:var(--good);
    padding:3px 9px;border-radius:20px;font-weight:700;
  }
  .shop-card h3{margin:0 92px 6px 0;font-size:15.5px;color:var(--navy-darker);line-height:1.35;}
  .shop-card .addr{font-size:12px;color:var(--ink-soft);line-height:1.5;min-height:36px;white-space:pre-line;}
  .shop-card .stats{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .shop-card .stat b{display:block;font-size:16px;color:var(--navy);}
  .shop-card .stat span{font-size:11px;color:var(--ink-soft);}
  .shop-card .kebab{position:absolute;bottom:12px;right:10px;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
  }
  .empty .big{font-size:34px;margin-bottom:8px;}
  .empty h3{color:var(--ink);margin:0 0 6px;}

  /* ===== Tables ===== */
  table.list{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.list th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-soft);border-bottom:2px solid var(--line);padding:9px 10px;font-weight:700;
  }
  table.list td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.list tr:hover td{background:#f7fafc;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .pill-paid{background:var(--good-bg);color:var(--good);}
  .pill-unpaid{background:var(--bad-bg);color:var(--bad);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .mono{font-variant-numeric:tabular-nums;font-family:"Consolas","SFMono-Regular",monospace;}
  .num-right{text-align:right;}

  /* ===== Forms ===== */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
  .field label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);
    background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #bcd4e6;border-color:var(--navy);}
  .field textarea{resize:vertical;min-height:64px;}
  .field .req{color:var(--red);}
  .field-note{font-size:11px;color:var(--ink-soft);}

  /* ===== Modal ===== */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,30,45,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;z-index:100;overflow-y:auto;
  }
  .modal{
    background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:pop .15s ease-out;
  }
  .modal.wide{max-width:960px;}
  @keyframes pop{from{transform:translateY(6px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:20px;max-height:72vh;overflow-y:auto;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;padding:4px 6px;border-radius:6px;}
  .close-x:hover{background:#f0f2f4;color:var(--ink);}

  /* ===== Invoice line item editor ===== */
  .item-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .item-table th{font-size:11px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 6px;border-bottom:2px solid var(--line);}
  .item-table td{padding:5px 6px;vertical-align:top;}
  .item-table input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;}
  .item-table input.qty,.item-table input.price{text-align:right;}
  .item-table .amt{font-weight:700;text-align:right;padding-top:8px;font-size:13px;white-space:nowrap;}
  .item-table .rm{background:none;border:none;color:#b7c0c8;font-size:16px;padding:4px 8px;border-radius:6px;}
  .item-table .rm:hover{color:var(--red);background:var(--bad-bg);}
  .add-row-btn{margin-top:10px;}
  .totals-box{display:flex;justify-content:flex-end;margin-top:14px;}
  .totals-box table{border-collapse:collapse;}
  .totals-box td{padding:6px 14px;font-size:14px;}
  .totals-box tr.grand td{font-size:17px;font-weight:800;color:var(--navy-darker);border-top:2px solid var(--line);padding-top:10px;}
  .status-toggle{display:flex;gap:8px;}
  .status-toggle label{
    flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13px;font-weight:700;
    cursor:pointer;color:var(--ink-soft);
  }
  .status-toggle input{display:none;}
  .status-toggle input:checked + span{}
  .status-toggle .opt-unpaid input:checked ~ span{color:var(--bad);}
  .status-toggle label.sel-unpaid{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
  .status-toggle label.sel-paid{border-color:var(--good);background:var(--good-bg);color:var(--good);}

  .datalist-wrap{position:relative;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy-darker);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:8px;
  }

  /* ===== Invoice document (preview / print) ===== */
  .doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .doc-wrap{background:#eef1f4;padding:22px;border-radius:var(--radius);}
  .invoice-doc{
    background:#fff;max-width:820px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.12);
    font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;
  }
  .doc-header{background:var(--navy);color:#fff;padding:18px 26px 14px;text-align:center;}
  .doc-header h1{margin:0 0 4px;font-size:22px;letter-spacing:.3px;}
  .doc-header .reg{font-size:12px;color:#dbe7f0;margin-bottom:2px;}
  .doc-header .addr{font-size:12px;color:#dbe7f0;}
  .doc-meta{display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding:14px 26px;font-size:13px;}
  .doc-meta .bill-to{white-space:pre-line;line-height:1.55;}
  .doc-meta .meta-table td{padding:1px 0;font-size:13px;}
  .doc-meta .meta-table td:first-child{color:#444;padding-right:10px;}
  .doc-meta .meta-table .inv-no{color:var(--red);font-weight:800;}
  .doc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .doc-table thead th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-size:12px;}
  .doc-table thead th.r{text-align:right;}
  .doc-table tbody td{padding:6px 10px;border-bottom:1px solid #eee;}
  .doc-table tbody td.r{text-align:right;}
  .doc-table tbody tr:nth-child(odd){background:var(--row-a);}
  .doc-table tbody tr:nth-child(even){background:var(--row-b);}
  .doc-total-row td{font-weight:800;border-top:2px solid var(--navy);background:#fff !important;padding:10px;}
  .doc-subtotal-row td{font-weight:600;background:#fff !important;padding:6px 10px;color:#555;font-size:12px;}
  .doc-footer{padding:16px 26px 22px;font-size:11.5px;color:#555;text-align:center;}
  .doc-footer .cgen{margin-bottom:14px;}
  .doc-footer .thanks{font-weight:700;color:var(--navy-darker);}
  .doc-status{
    display:inline-block;margin-top:10px;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;
  }
  .doc-status-bar{
    max-width:820px;margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;
  }
  .pill-btn{border:none;cursor:pointer;font-size:12px;}
  .pill-btn:hover{filter:brightness(0.95);}

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body *{visibility:hidden;}
    .invoice-doc,.invoice-doc *{visibility:visible;}
    .invoice-doc{position:absolute;top:0;left:0;box-shadow:none;max-width:100%;}
    .doc-wrap{padding:0;background:#fff;}
    @page{margin:14mm;}
  }

  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    #app{padding:12px;}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
    .topbar-actions{width:100%;}
  }
</style>
</head>

const HAS_REMOTE = typeof APPS_SCRIPT_URL === 'string' && APPS_SCRIPT_URL.startsWith('http') && !APPS_SCRIPT_URL.includes('PASTE_YOUR');

const LOCAL_PREFIX = 'yakyim_invoice_';
const SHARED = true; // shared:true = everyone who opens this same artifact link sees/edits the same data (Claude-storage mode only)
let usingLocalFallback = HAS_REMOTE ? false : !(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
let AUTO_SYNC_TIMER = null;
let STATUS_TICK_TIMER = null;
let RECONNECT_TIMER = null;
let lastSyncAt = null;
let SYNCING = false;

async function loadAll(){
  try{
    const [c,s,p] = await Promise.all([
      safeGet('company'), safeGet('shops'), safeGet('products')
    ]);
    if(!s){
      DB.company = SEED_DATA.company;
      DB.shops = SEED_DATA.shops;
      DB.products = SEED_DATA.products;
      DB.invoices = SEED_DATA.invoices;
      await persistAll();
      showToast('Sample data imported from your files ✓');
    } else {
      DB.company = c || SEED_DATA.company;
      DB.shops = s || [];
      DB.products = p || [];
      DB.invoices = await loadAllInvoices(DB.shops);
    }
  }catch(e){
    console.error('load error', e);
    DB.company = SEED_DATA.company; DB.shops = SEED_DATA.shops;
    DB.products = SEED_DATA.products; DB.invoices = SEED_DATA.invoices;
  }
  if(usingLocalFallback){
    showToast('Saving in this browser only (localStorage) — data won\'t follow you to another device or browser');
    startReconnectWatcher();
  } else {
    lastSyncAt = Date.now();
    showToast(HAS_REMOTE ? 'Shared mode (Google Sheets) — everyone sees the same data' : 'Shared mode — everyone with this artifact link sees the same data');
    startAutoSync();
    startStatusTicker();
  }
  render();
}

/* ---- Invoices are stored ONE KEY PER SHOP ("invoices__<shopId>"),
   not as one giant blob. Google Sheets caps a single cell at 50,000
   characters — a growing invoice list would eventually blow past
   that limit silently. Splitting by shop keeps each cell small and
   scales indefinitely as more invoices get added. ---- */
async function loadAllInvoices(shops){
  const lists = await Promise.all((shops||[]).map(s => safeGet(`invoices__${s.id}`)));
  return lists.reduce((all, list)=> all.concat(list || []), []);
}

/* ---- Google Apps Script transport ----
   Google's Web App responses don't carry CORS headers by default, so a
   plain fetch() call from a Claude artifact (a different origin) gets
   blocked with "Failed to fetch" even though the URL works fine when
   you open it directly in a browser tab. Two standard workarounds:
   - READS: JSONP via a <script> tag — browsers don't apply CORS to
     script tags, only to fetch()/XHR.
   - WRITES: fetch() with mode:'no-cors' — the browser still SENDS the
     POST body (Apps Script receives and processes it fine), it just
     can't let us read the response back. We treat a successful send
     as success; the next read reflects the true state either way.
   ---- */
let _jsonpCounter = 0;
function jsonpRequest(url, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  return new Promise((resolve, reject)=>{
    const cbName = '_yakyim_jsonp_' + (_jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(()=>{
      if(done) return; done = true;
      cleanup();
      reject(new Error('JSONP request timed out'));
    }, timeoutMs);
    function cleanup(){
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    window[cbName] = (data)=>{
      if(done) return; done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = ()=>{
      if(done) return; done = true;
      cleanup();
      reject(new Error('JSONP script failed to load — check the Apps Script URL and that it is deployed with access "Anyone"'));
    };
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

async function remoteGet(key){
  const j = await jsonpRequest(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
  if(j.error) throw new Error(j.error);
  return j.value; // JSON string or null
}
async function remoteSet(key, valueStr){
  // 'text/plain' keeps this a CORS "simple request" even under no-cors mode.
  await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({ key, value: valueStr })
  });
  // Response is opaque under no-cors — can't confirm success from it.
  // A real network failure (wrong URL, offline, DNS) still throws above,
  // which the caller's retry/fallback logic already handles.
  return true;
}

async function safeGet(key){
  if(!usingLocalFallback){
    try{
      if(HAS_REMOTE){
        const raw = await remoteGet(key);
        return raw ? JSON.parse(raw) : null;
      } else {
        const r = await window.storage.get(key, SHARED);
        return r ? JSON.parse(r.value) : null;
      }
    }catch(e){
      console.error('remote get failed, switching to localStorage fallback', e);
      usingLocalFallback = true;
      startReconnectWatcher();
    }
  }
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('localStorage read failed', key, e);
    return null;
  }
}

const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));

async function safeSet(key,val,retries){
  retries = retries===undefined ? 3 : retries;
  const valStr = JSON.stringify(val);

  if(!usingLocalFallback){
    for(let attempt=0; attempt<=retries; attempt++){
      try{
        if(HAS_REMOTE) await remoteSet(key, valStr);
        else await window.storage.set(key, valStr, SHARED);
        return true;
      }
      catch(e){
        console.error('save fail (remote)',key,'attempt',attempt,e);
        if(attempt<retries) await sleep(400*(attempt+1));
      }
    }
    console.warn('remote storage unavailable — switching to localStorage fallback');
    usingLocalFallback = true;
    showToast('Cloud save unavailable — switched to saving in this browser only (no longer shared with others)', true);
    startReconnectWatcher();
  }

  try{
    localStorage.setItem(LOCAL_PREFIX+key, valStr);
    return true;
  }catch(e){
    console.error('localStorage save failed', key, e);
    return false;
  }
}

/* ---- Pull the latest shared data from teammates and re-render.
   Skipped while a modal is open so it never overwrites what
   someone is actively typing. ---- */
async function syncFromServer(showFeedback){
  if(usingLocalFallback) return; // nothing to sync, this browser only
  if(document.getElementById('modal-backdrop')) return; // don't disrupt an open form
  if(SYNCING) return;
  SYNCING = true;
  try{
    const [c,s,p] = await Promise.all([
      safeGet('company'), safeGet('shops'), safeGet('products')
    ]);
    DB.company = c || DB.company;
    DB.shops = s || DB.shops;
    DB.products = p || DB.products;
    DB.invoices = await loadAllInvoices(DB.shops);
    lastSyncAt = Date.now();
    render();
    if(showFeedback) showToast('Synced ✓');
  }catch(e){
    console.error('sync failed', e);
    if(showFeedback) showToast('Sync failed — check your connection', true);
  }finally{
    SYNCING = false;
  }
}
function startAutoSync(){
  if(AUTO_SYNC_TIMER || usingLocalFallback) return;
  AUTO_SYNC_TIMER = setInterval(()=> syncFromServer(false), HAS_REMOTE ? 8000 : 4000);
  // Sync immediately whenever the tab becomes visible/focused again —
  // this is what makes it FEEL real-time: the moment you switch back
  // to check on things, you see whatever a teammate just saved,
  // instead of waiting for the next poll tick.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') syncFromServer(false);
  });
  window.addEventListener('focus', ()=> syncFromServer(false));
}
function startStatusTicker(){
  if(STATUS_TICK_TIMER) return;
  STATUS_TICK_TIMER = setInterval(renderConnStatus, 1000);
}
/* ---- While stuck on localStorage (backend errored out),
   periodically test if it's back. We deliberately do NOT
   auto-merge/switch live — that risks silently overwriting
   someone else's data. We just tell the user to reload, which
   safely re-runs loadAll() from scratch. ---- */
function startReconnectWatcher(){
  if(RECONNECT_TIMER) return;
  RECONNECT_TIMER = setInterval(async ()=>{
    if(!usingLocalFallback){ clearInterval(RECONNECT_TIMER); RECONNECT_TIMER=null; return; }
    try{
      if(HAS_REMOTE) await remoteGet('company');
      else{
        if(!(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function')) return;
        await window.storage.get('company', SHARED);
      }
      clearInterval(RECONNECT_TIMER); RECONNECT_TIMER = null;
      showToast('☁️ Cloud storage is back online — reload this page to reconnect and sync with everyone', true);
    }catch(e){
      // still down, keep waiting silently
    }
  }, 30000);
}
function connStatusText(){
  if(usingLocalFallback) return '🔴 Local only — not shared with others';
  if(!lastSyncAt) return '🟡 Shared — connecting…';
  const secs = Math.max(0, Math.round((Date.now()-lastSyncAt)/1000));
  const when = secs<2 ? 'just now' : secs+'s ago';
  return `🟢 Shared${HAS_REMOTE ? ' (Sheets)' : ''} — synced ${when}`;
}
function renderConnStatus(){
  const el = document.getElementById('conn-status');
  if(el) el.textContent = connStatusText();
}
async function persistAll(){
  await safeSet('company',DB.company);
  await safeSet('shops',DB.shops);
  await safeSet('products',DB.products);
  for(const shop of DB.shops){
    await persistInvoicesForShop(shop.id);
  }
}
async function persist(key){
  SAVING = true; renderSaveIndicator();
  const ok = await safeSet(key, DB[key]);
  SAVING = false; renderSaveIndicator();
  if(!ok) showToast('Save failed. Retrying automatically — please check your connection and try saving again.', true);
  return ok;
}
/* ---- Save only one shop's invoices (its own small cell/key) rather
   than the whole invoices array every time something changes. ---- */
async function persistInvoicesForShop(shopId){
  SAVING = true; renderSaveIndicator();
  const list = DB.invoices.filter(i=>i.shopId===shopId);
  const ok = await safeSet(`invoices__${shopId}`, list);
  SAVING = false; renderSaveIndicator();
  if(!ok) showToast('Save failed. Retrying automatically — please check your connection and try saving again.', true);
  return ok;
}
function renderSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = SAVING ? 'Saving…' : 'All changes saved';
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer=null;
function showToast(msg, isErr){
  const root = document.getElementById('toast-root');
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast" style="${isErr?'background:#b3271f':''}">${isErr?'⚠':'✓'} ${escapeHtml(msg)}</div>`;
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 2600);
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   DERIVED HELPERS
   ============================================================ */
function shopById(id){ return DB.shops.find(s=>s.id===id); }
function invoicesForShop(id){ return DB.invoices.filter(i=>i.shopId===id).sort((a,b)=> b.date.localeCompare(a.date) || b.invoiceNo.localeCompare(a.invoiceNo)); }
function invoiceSubtotal(inv){ return inv.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0); }
function roundMYR(n){ return Math.round(n*20)/20; }
function invoiceTotal(inv){ return roundMYR(invoiceSubtotal(inv)); }
function shopTotal(id){ return invoicesForShop(id).reduce((s,i)=> s+invoiceTotal(i), 0); }
function shopPaidTotal(id){ return invoicesForShop(id).filter(i=>i.status==='paid').reduce((s,i)=> s+invoiceTotal(i), 0); }
function shopUnpaidTotal(id){ return invoicesForShop(id).filter(i=>i.status!=='paid').reduce((s,i)=> s+invoiceTotal(i), 0); }
function nextInvoiceNo(shopId){
  const nums = invoicesForShop(shopId).map(i=>{
    const m = i.invoiceNo.match(/(\d+)/); return m? parseInt(m[1],10) : 0;
  });
  const max = nums.length? Math.max(...nums) : 0;
  return 'IV-' + String(max+1).padStart(5,'0');
}

/* ============================================================
   RENDER: ROOT ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderTopbar() + renderCrumbs();
  if(VIEW.name==='dashboard') app.innerHTML += renderDashboard();
  else if(VIEW.name==='shop') app.innerHTML += renderShopDetail(VIEW.shopId);
  else if(VIEW.name==='catalog') app.innerHTML += renderCatalog();
  else if(VIEW.name==='invoice'){
    app.innerHTML += renderInvoiceView(VIEW.invoiceId);
    const inv = DB.invoices.find(i=>i.id===VIEW.invoiceId);
    if(inv) refreshInvoiceExportLinks(inv);
  }
  attachGlobalHandlers();
}

function go(name, extra){
  VIEW = {name, shopId:null, invoiceId:null, ...extra};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  syncFromServer(false); // pull latest the instant you navigate somewhere
}

  <div class="topbar">

      <div class="brand-text">
        <h1>${escapeHtml(DB.company?.name || 'Invoice System')}</h1>

    </div>
    <div class="topbar-actions">
      ${usingLocalFallback ? '' : '<button class="btn" id="btn-sync">🔄 Sync</button>'}

function renderCrumbs(){
  let parts = [`<button data-nav="dashboard">🏠 Home</button>`];
  if(VIEW.name==='shop'){
    const shop = shopById(VIEW.shopId);
    parts.push(`<span class="sep">›</span><span class="current">${escapeHtml(shop?.name||'')}</span>`);
  } else if(VIEW.name==='catalog'){
    parts.push(`<span class="sep">›</span><span class="current">Products &amp; Pricing</span>`);
  } else if(VIEW.name==='invoice'){
    const inv = DB.invoices.find(i=>i.id===VIEW.invoiceId);
    const shop = inv? shopById(inv.shopId): null;
    if(shop) parts.push(`<span class="sep">›</span><button data-nav="shop" data-shop="${shop.id}">${escapeHtml(shop.name)}</button>`);
    parts.push(`<span class="sep">›</span><span class="current">Invoice ${escapeHtml(inv?.invoiceNo||'')}</span>`);
  }
  return `<div class="crumbs">${parts.join('')}</div>`;
}

  const shop = shopById(inv.shopId);
  const subtotal = invoiceSubtotal(inv);
  const total = roundMYR(subtotal);
  const roundingAdj = total - subtotal;
  const paid = inv.status==='paid';

  const rows = inv.items.map((it,idx)=>`
    <tr>
      <td>${idx+1}</td>
      <td>${escapeHtml(it.code||'')}</td>

      </table>

/* ============================================================
   EXPORT (print / download as standalone HTML)
   No external libraries, no network calls — works even when a
   sandboxed viewer blocks window.print() or CDN scripts. Both
   export actions are REAL <a> links the user clicks themselves
   (not a script-triggered click), which is what makes downloads
   and new-tab opens reliable inside a sandboxed artifact.
   "Open to Print" opens a plain, unsandboxed browser tab with a
   Print button in it — printing from there is unaffected by any
   restrictions in the artifact's own frame.
   ============================================================ */
let _lastExportUrl = null;

function buildInvoiceStandaloneHTML(inv, node){
  const styleEl = document.querySelector('style');
  const styleCss = styleEl ? styleEl.innerHTML : '';
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Invoice ${escapeHtml(inv.invoiceNo)}</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#eef1f4;margin:0;padding:24px;}
  .hint-bar{max-width:820px;margin:0 auto 14px;text-align:center;font-size:13px;color:#555;}
  .hint-bar button{margin-top:8px;padding:8px 18px;border-radius:8px;border:none;background:#1c4e73;color:#fff;font-size:13px;cursor:pointer;}
  ${styleCss}
  @media print{ .hint-bar{display:none;} body{background:#fff;padding:0;} }
</style></head>
<body>
  <div class="hint-bar">This is your invoice.<br>
    <button onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
  <div class="doc-wrap">${node.outerHTML}</div>
</body></html>`;
}

function refreshInvoiceExportLinks(inv){
  const node = document.getElementById('invoice-doc-root');
  const openLink = document.getElementById('link-open-print');
  const downloadLink = document.getElementById('link-download-html');
  if(!node || !openLink || !downloadLink) return;
  try{
    const html = buildInvoiceStandaloneHTML(inv, node);
    const blob = new Blob([html], {type:'text/html'});
    if(_lastExportUrl) URL.revokeObjectURL(_lastExportUrl);
    const url = URL.createObjectURL(blob);
    _lastExportUrl = url;
    openLink.href = url;
    downloadLink.href = url;
    downloadLink.download = `Invoice_${inv.invoiceNo}.html`;
  }catch(e){
    console.error('building export link failed', e);
    showToast('Could not prepare the invoice for export', true);
  }
}

/* ============================================================
   ATTACH HANDLERS (delegation)
   ============================================================ */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const name = el.getAttribute('data-nav');
      if(name==='shop') go('shop',{shopId:el.getAttribute('data-shop')});
      else go(name);
    };
  });
  const syncBtn = document.getElementById('btn-sync');
  if(syncBtn) syncBtn.onclick = ()=> syncFromServer(true);

  const addShopBtn = document.getElementById('btn-add-shop');
  if(addShopBtn) addShopBtn.onclick = ()=> openShopModal(null);

  document.querySelectorAll('[data-edit-shop]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openShopModal(el.getAttribute('data-edit-shop')); };
  });
  const editShopH = document.getElementById('btn-edit-shop-h');
  if(editShopH) editShopH.onclick = ()=> openShopModal(VIEW.shopId);
  const delShopBtn = document.getElementById('btn-del-shop');
  if(delShopBtn) delShopBtn.onclick = ()=> confirmDeleteShop(VIEW.shopId);

  const newInvBtn = document.getElementById('btn-new-invoice');
  if(newInvBtn) newInvBtn.onclick = ()=> openInvoiceModal(null, VIEW.shopId);

  document.querySelectorAll('[data-view-invoice]').forEach(el=>{
    el.onclick = ()=> go('invoice',{invoiceId:el.getAttribute('data-view-invoice')});
  });
  document.querySelectorAll('[data-edit-invoice]').forEach(el=>{
    el.onclick = ()=>{
      const inv = DB.invoices.find(i=>i.id===el.getAttribute('data-edit-invoice'));
      openInvoiceModal(inv, inv.shopId);
    };
  });
  document.querySelectorAll('[data-del-invoice]').forEach(el=>{
    el.onclick = ()=> confirmDeleteInvoice(el.getAttribute('data-del-invoice'));
  });
  document.querySelectorAll('[data-toggle-status]').forEach(el=>{
    el.onclick = async ()=>{
      const inv = DB.invoices.find(i=>i.id===el.getAttribute('data-toggle-status'));
      inv.status = inv.status==='paid' ? 'unpaid' : 'paid';
      render();
      await persistInvoicesForShop(inv.shopId);
      showToast(inv.status==='paid' ? 'Marked as paid ✓' : 'Marked as unpaid');
    };
  });

  const toggleStatusBtn = document.getElementById('btn-toggle-status');
  if(toggleStatusBtn) toggleStatusBtn.onclick = async ()=>{
    const inv = DB.invoices.find(i=>i.id===VIEW.invoiceId);
    inv.status = inv.status==='paid' ? 'unpaid' : 'paid';
    render();
    await persistInvoicesForShop(inv.shopId);
    showToast(inv.status==='paid' ? 'Marked as paid ✓' : 'Marked as unpaid');
  };

  const catSearch = document.getElementById('catalog-search');
  if(catSearch){
    catSearch.oninput = (e)=>{ catalogFilter = e.target.value; render(); document.getElementById('catalog-search').focus(); const v=document.getElementById('catalog-search'); v.value=catalogFilter; v.setSelectionRange(v.value.length,v.value.length); };
  }
  const addProdBtn = document.getElementById('btn-add-product');
  if(addProdBtn) addProdBtn.onclick = ()=> openProductModal(null);
  document.querySelectorAll('[data-edit-product]').forEach(el=>{
    el.onclick = ()=> openProductModal(el.getAttribute('data-edit-product'));
  });
  document.querySelectorAll('[data-del-product]').forEach(el=>{
    el.onclick = ()=> confirmDeleteProduct(el.getAttribute('data-del-product'));
  });
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function openModal(html, wide){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal ${wide?'wide':''}">${html}</div>
    </div>`;
  document.getElementById('modal-backdrop').addEventListener('mousedown', (e)=>{
    if(e.target.id==='modal-backdrop') closeModal();
  });
}

/* ============================================================
   MODAL: SHOP add/edit
   ============================================================ */
function openShopModal(shopId){
  const shop = shopId? shopById(shopId) : {id:null,name:'',billTo:['','','']};
  const lines = (shop.billTo && shop.billTo.length? shop.billTo : ['','','']);
  openModal(`
    <div class="modal-head"><h3>${shopId?'Edit Shop':'Add New Shop'}</h3>
      <button class="close-x" id="m-close">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Shop Name (shown in list) <span class="req">*</span></label>
        <input id="f-shop-name" value="${escapeHtml(shop.name)}" placeholder="e.g. SP Sports Academy Sdn Bhd">
      </div>
      <div class="field">
        <label>Bill To details — enter exactly as you want it to appear on the invoice. First line is the name/contact.</label>
        <textarea id="f-shop-billto" rows="4" placeholder="Contact name / Company&#10;Address line 1&#10;Address line 2">${escapeHtml(lines.join('\n'))}</textarea>
        <span class="field-note">Start a new line for each line you want displayed</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-save">Save</button>
    </div>
  `);
  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-save').onclick = async ()=>{
    const name = document.getElementById('f-shop-name').value.trim();
    if(!name){ showToast('Please enter a shop name', true); return; }
    const billTo = document.getElementById('f-shop-billto').value.split('\n').map(s=>s.trim()).filter((s,i,a)=> s!=='' || i<a.length-1);
    if(shopId){
      const s = shopById(shopId); s.name = name; s.billTo = billTo.length? billTo : [name];
    } else {
      DB.shops.push({id:uid('shop'), name, billTo: billTo.length? billTo : [name]});
    }
    closeModal(); render();
    await persist('shops');
    showToast('Shop info saved');
  };
}

function confirmDeleteShop(shopId){
  const shop = shopById(shopId);
  const invCount = invoicesForShop(shopId).length;
  openModal(`
    <div class="modal-head"><h3>Delete this shop?</h3><button class="close-x" id="m-close">✕</button></div>
    <div class="modal-body">
      <p>You are about to delete <b>${escapeHtml(shop.name)}</b>${invCount? ` and all ${invCount} invoice${invCount===1?'':'s'} for this shop` : ''}. This action cannot be undone.</p>
    </div>
    <div class="modal-foot">
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn btn-danger" id="m-confirm">Delete Shop</button>
    </div>
  `);
  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = async ()=>{
    DB.shops = DB.shops.filter(s=>s.id!==shopId);
    DB.invoices = DB.invoices.filter(i=>i.shopId!==shopId);
    closeModal(); go('dashboard');
    await Promise.all([persist('shops'), persistInvoicesForShop(shopId)]);
    showToast('Shop deleted');
  };
}

function openProductModal(code){

  openModal(`

    <div class="modal-body">
      <div class="form-grid">

        <div class="field"><label>Unit</label><input id="f-p-unit" value="${escapeHtml(p.unit)}" placeholder="Pack / Bottle / Kilogram"></div>
      </div>
      <div class="field"><label>Product Name <span class="req">*</span></label><input id="f-p-desc" value="${escapeHtml(p.desc)}"></div>
      <div class="field"><label>Price/Unit (MYR)</label><input id="f-p-price" type="number" step="0.01" value="${p.price}"></div>
    </div>

      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-save">Save</button>
    </div>
  `);
  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-save').onclick = async ()=>{
    const codeVal = document.getElementById('f-p-code').value.trim();
    const desc = document.getElementById('f-p-desc').value.trim();
    const unit = document.getElementById('f-p-unit').value.trim();
    const price = parseFloat(document.getElementById('f-p-price').value)||0;

    showToast('Product saved');

function confirmDeleteProduct(code){
  openModal(`
    <div class="modal-head"><h3>Delete this product?</h3><button class="close-x" id="m-close">✕</button></div>

    await persist('products');

  };
}

/* ============================================================
   MODAL: INVOICE add/edit
   ============================================================ */
function openInvoiceModal(existing, shopId){
  DRAFT = existing ? JSON.parse(JSON.stringify(existing)) : {
    id:null, invoiceNo: nextInvoiceNo(shopId), shopId, date: todayISO(), terms:'14 days',
    status:'unpaid',
    items:[ blankItem() ]
  };
  renderInvoiceModal();
}
function blankItem(){ return {code:'',desc:'',qty:1,unit:'',price:0}; }

function renderInvoiceModal(){
  const shopOptions = DB.shops.map(s=>`<option value="${s.id}" ${s.id===DRAFT.shopId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  const subtotal = DRAFT.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
  const total = roundMYR(subtotal);
  const roundingAdj = total - subtotal;
  const showRounding = Math.abs(roundingAdj) >= 0.005;
  const sortedProducts = [...DB.products].sort((a,b)=> a.desc.localeCompare(b.desc));

  const rows = DRAFT.items.map((it,idx)=>{
    const isKnown = DB.products.some(p=>p.code===it.code && p.desc===it.desc);
    const isBlank = !it.code && !it.desc;
    const isCustom = !isBlank && !isKnown;
    const descOptions = [
      `<option value="" ${isBlank?'selected':''}>— Select item —</option>`,
      `<option value="__custom__" ${isCustom?'selected':''}>✎ Custom / type manually…</option>`,
      ...sortedProducts.map(p=>`<option value="${escapeHtml(p.code)}" ${it.code===p.code && it.desc===p.desc?'selected':''}>${escapeHtml(p.desc)}</option>`)
    ].join('');
    return `
    <tr data-idx="${idx}">
      <td style="padding-top:9px;">${idx+1}</td>
      <td>
        <input class="item-code" list="product-datalist" value="${escapeHtml(it.code)}" placeholder="Code" data-idx="${idx}">
      </td>
      <td>
        <select class="item-desc-select" data-idx="${idx}">${descOptions}</select>
        ${isCustom ? `<input class="item-desc-custom" value="${escapeHtml(it.desc)}" placeholder="Custom description" data-idx="${idx}" style="margin-top:6px;">` : ''}
      </td>
      <td style="width:70px;"><input class="qty item-qty" type="number" step="any" value="${it.qty}" data-idx="${idx}"></td>
      <td style="width:90px;"><input class="item-unit" value="${escapeHtml(it.unit)}" placeholder="Unit" data-idx="${idx}"></td>
      <td style="width:90px;"><input class="price item-price" type="number" step="0.01" value="${it.price}" data-idx="${idx}"></td>
      <td class="amt">${((Number(it.qty)||0)*(Number(it.price)||0)).toFixed(2)}</td>
      <td><button class="rm" data-rm="${idx}" title="Remove this item">✕</button></td>
    </tr>`;
  }).join('');

  openModal(`
    <div class="modal-head"><h3>${DRAFT.id? 'Edit Invoice '+escapeHtml(DRAFT.invoiceNo) : 'New Invoice'}</h3>
      <button class="close-x" id="m-close">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Shop <span class="req">*</span></label>
          <select id="f-inv-shop">${shopOptions}</select></div>
        <div class="field"><label>Invoice No.</label>
          <input id="f-inv-no" value="${escapeHtml(DRAFT.invoiceNo)}"></div>
        <div class="field"><label>Date</label><input id="f-inv-date" type="date" value="${DRAFT.date}"></div>
        <div class="field"><label>Payment Terms</label><input id="f-inv-terms" value="${escapeHtml(DRAFT.terms||'')}" placeholder="e.g. 14 days"></div>
      </div>
      <div class="field">
        <label>Payment Status</label>
        <div class="status-toggle">
          <label class="${DRAFT.status!=='paid'?'sel-unpaid':''}"><input type="radio" name="f-status" value="unpaid" ${DRAFT.status!=='paid'?'checked':''}><span>Unpaid</span></label>
          <label class="${DRAFT.status==='paid'?'sel-paid':''}"><input type="radio" name="f-status" value="paid" ${DRAFT.status==='paid'?'checked':''}><span>Paid</span></label>
        </div>
      </div>

      <label style="font-size:12px;font-weight:700;color:var(--ink-soft);">Line Items</label>
      <table class="item-table">
        <thead><tr><th style="width:22px;">#</th><th style="width:110px;">Code</th><th>Description</th><th>Qty</th><th>Unit</th><th>Price/Unit</th><th style="width:80px;">Amount</th><th></th></tr></thead>
        <tbody id="item-rows">${rows}</tbody>
      </table>
      <datalist id="product-datalist">
        ${DB.products.map(p=>`<option value="${escapeHtml(p.code)} — ${escapeHtml(p.desc)}"></option>`).join('')}
      </datalist>
      <button class="btn btn-sm add-row-btn" id="btn-add-item">+ Add Item</button>

      <div class="totals-box"><table>
        <tr id="totals-subtotal-row" style="${showRounding?'':'display:none;'}"><td>Subtotal</td><td id="totals-subtotal-cell">${money(subtotal)}</td></tr>
        <tr id="totals-rounding-row" style="${showRounding?'':'display:none;'}"><td>Rounding Adjustment</td><td id="totals-rounding-cell">${roundingAdj>=0?'+':''}${roundingAdj.toFixed(2)}</td></tr>
        <tr class="grand"><td>Grand Total</td><td id="totals-grand-cell">${money(total)}</td></tr>
      </table></div>
      <div class="field-note" style="text-align:right;margin-top:4px;">Rounded to the nearest 5 sen (Malaysia rounding mechanism)</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="m-cancel">Cancel</button>
      <button class="btn btn-primary" id="m-save">💾 Save Invoice</button>
    </div>
  `, true);

  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-cancel').onclick = closeModal;

  document.getElementById('f-inv-shop').onchange = (e)=>{ DRAFT.shopId = e.target.value; };
  document.getElementById('f-inv-no').oninput = (e)=>{ DRAFT.invoiceNo = e.target.value; };
  document.getElementById('f-inv-date').onchange = (e)=>{ DRAFT.date = e.target.value; };
  document.getElementById('f-inv-terms').oninput = (e)=>{ DRAFT.terms = e.target.value; };
  document.querySelectorAll('input[name="f-status"]').forEach(r=>{
    r.onchange = (e)=>{ DRAFT.status = e.target.value; renderInvoiceModal(); };
  });

  document.querySelectorAll('.item-code').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const idx = +e.target.dataset.idx;
      const val = e.target.value;
      const m = val.match(/^(\S+)\s*—\s*(.*)$/);
      const code = m? m[1] : val.trim();
      const prod = DB.products.find(p=>p.code===code);
      DRAFT.items[idx].code = code;
      if(prod){
        DRAFT.items[idx].desc = prod.desc;
        DRAFT.items[idx].unit = prod.unit;
        DRAFT.items[idx].price = prod.price;
      }
      renderInvoiceModal();
    });
  });
  document.querySelectorAll('.item-desc-select').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const idx = +e.target.dataset.idx;
      const val = e.target.value;
      if(val === '__custom__'){
        DRAFT.items[idx].code = '';
      } else if(val === ''){
        DRAFT.items[idx].code = '';
        DRAFT.items[idx].desc = '';
        DRAFT.items[idx].unit = '';
        DRAFT.items[idx].price = 0;
      } else {
        const prod = DB.products.find(p=>p.code===val);
        if(prod){
          DRAFT.items[idx].code = prod.code;
          DRAFT.items[idx].desc = prod.desc;
          DRAFT.items[idx].unit = prod.unit;
          DRAFT.items[idx].price = prod.price;
        }
      }
      renderInvoiceModal();
    });
  });
  document.querySelectorAll('.item-desc-custom').forEach(inp=>{
    inp.oninput = (e)=>{ DRAFT.items[+e.target.dataset.idx].desc = e.target.value; };
  });
  document.querySelectorAll('.item-qty').forEach(inp=>{
    inp.oninput = (e)=>{ DRAFT.items[+e.target.dataset.idx].qty = e.target.value; updateRowAmount(+e.target.dataset.idx); updateGrandTotal(); };
  });
  document.querySelectorAll('.item-unit').forEach(inp=>{
    inp.oninput = (e)=>{ DRAFT.items[+e.target.dataset.idx].unit = e.target.value; };
  });
  document.querySelectorAll('.item-price').forEach(inp=>{
    inp.oninput = (e)=>{ DRAFT.items[+e.target.dataset.idx].price = e.target.value; updateRowAmount(+e.target.dataset.idx); updateGrandTotal(); };
  });
  document.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.rm;
      DRAFT.items.splice(idx,1);
      if(DRAFT.items.length===0) DRAFT.items.push(blankItem());
      renderInvoiceModal();
    };
  });
  document.getElementById('btn-add-item').onclick = ()=>{
    DRAFT.items.push(blankItem());
    renderInvoiceModal();
    const sels = document.querySelectorAll('.item-desc-select');
    if(sels.length) sels[sels.length-1].focus();
  };

  document.getElementById('m-save').onclick = async ()=>{
    if(!DRAFT.shopId){ showToast('Please select a shop', true); return; }
    if(!DRAFT.invoiceNo.trim()){ showToast('Please enter an invoice number', true); return; }
    const cleanItems = DRAFT.items
      .map(it=>({code:(it.code||'').trim(), desc:(it.desc||'').trim(), qty:Number(it.qty)||0, unit:(it.unit||'').trim(), price:Number(it.price)||0}))
      .filter(it=> it.desc!=='' && it.qty>0);
    if(cleanItems.length===0){ showToast('Please add at least one line item', true); return; }
    DRAFT.items = cleanItems;

    let prevShopId = null;
    if(DRAFT.id){
      const idx = DB.invoices.findIndex(i=>i.id===DRAFT.id);
      prevShopId = DB.invoices[idx].shopId;
      DB.invoices[idx] = DRAFT;
    } else {
      DRAFT.id = uid('inv');
      DB.invoices.push(DRAFT);
    }
    const savedShopId = DRAFT.shopId;
    const savedId = DRAFT.id;
    closeModal();
    go('shop',{shopId:savedShopId});
    await persistInvoicesForShop(savedShopId);
    if(prevShopId && prevShopId !== savedShopId) await persistInvoicesForShop(prevShopId); // moved shops — clear it out of the old shop's key too
    showToast('Invoice saved ✓');
  };
}
function updateRowAmount(idx){
  const it = DRAFT.items[idx];
  const tr = document.querySelector(`#item-rows tr[data-idx="${idx}"]`);
  if(tr) tr.querySelector('.amt').textContent = ((Number(it.qty)||0)*(Number(it.price)||0)).toFixed(2);
}
function updateGrandTotal(){
  const subtotal = DRAFT.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
  const total = roundMYR(subtotal);
  const roundingAdj = total - subtotal;
  const show = Math.abs(roundingAdj) >= 0.005;
  const subRow = document.getElementById('totals-subtotal-row');
  const rndRow = document.getElementById('totals-rounding-row');
  if(subRow) subRow.style.display = show ? '' : 'none';
  if(rndRow) rndRow.style.display = show ? '' : 'none';
  const subCell = document.getElementById('totals-subtotal-cell');
  const rndCell = document.getElementById('totals-rounding-cell');
  const grandCell = document.getElementById('totals-grand-cell');
  if(subCell) subCell.textContent = money(subtotal);
  if(rndCell) rndCell.textContent = (roundingAdj>=0?'+':'') + roundingAdj.toFixed(2);
  if(grandCell) grandCell.textContent = money(total);
}

function confirmDeleteInvoice(invId){
  const inv = DB.invoices.find(i=>i.id===invId);
  openModal(`
    <div class="modal-head"><h3>Delete this invoice?</h3><button class="close-x" id="m-close">✕</button></div>
    <div class="modal-body"><p>Delete invoice <b>${escapeHtml(inv.invoiceNo)}</b> worth <b>${money(invoiceTotal(inv))}</b>. This action cannot be undone.</p></div>
    <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-danger" id="m-confirm">Delete Invoice</button></div>
  `);
  document.getElementById('m-close').onclick = closeModal;
  document.getElementById('m-cancel').onclick = closeModal;
  document.getElementById('m-confirm').onclick = async ()=>{
    const shopId = inv.shopId;
    DB.invoices = DB.invoices.filter(i=>i.id!==invId);
    closeModal();
    if(VIEW.name==='invoice') go('shop',{shopId}); else render();
    await persistInvoicesForShop(shopId);
    showToast('Invoice deleted');
  };
}

loadAll();
